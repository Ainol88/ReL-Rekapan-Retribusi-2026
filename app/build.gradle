
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.go.rekapanretribusi'
    compileSdk 35

    defaultConfig {
        applicationId 'id.go.rekapanretribusi'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Samakan target Java dengan Kotlin
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
